<!doctype html>
<!--
  SAT's Domeport (GPL-3.0) built for the web, with the two fixes from this repo.
  This page reads media.json and loads the chosen item:
    a still replaces Domeport's Domemaster test pattern (/app/assets/8192.png),
    a video is copied into the app's filesystem and opened in "Video file" mode.
  The two big files ship gzipped to stay under GitHub's 100 MB limit and are
  inflated in the browser.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
  <meta name="robots" content="noindex, nofollow">
  <title>The Park, dome</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ccc; font: 12px monospace; }
    #screen { width: 100%; height: 100%; }
    #status[hidden] { display: none; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; }
    #pick { position: absolute; top: 8px; left: 8px; z-index: 1; }
  </style>
</head>
<body>
  <script src="coi-serviceworker.min.js"></script>
  <div id="status">Loading the dome...</div>
  <div id="screen"></div>
  <script>
    // ossia-score.wasm and ossia-score.data ship as .gz; inflate them on the way in.
    const realFetch = window.fetch.bind(window);
    window.fetch = async (input, init) => {
      const url = typeof input === 'string' ? input : input.url;
      const big = url.match(/ossia-score\.(wasm|data)$/);
      if (!big) return realFetch(input, init);
      const res = await realFetch(url + '.gz', init);
      if (!res.ok) return res;
      // A host that labels .gz as Content-Encoding: gzip has already inflated it.
      const inflated = /gzip/.test(res.headers.get('Content-Encoding') || '');
      return new Response(inflated ? res.body : res.body.pipeThrough(new DecompressionStream('gzip')), {
        headers: { 'Content-Type': big[1] === 'wasm' ? 'application/wasm' : 'application/octet-stream' },
      });
    };

    async function boot() {
      const status = document.getElementById('status');
      const screen = document.getElementById('screen');
      try {
        const { items } = await (await realFetch('media.json')).json();
        const wanted = new URLSearchParams(location.search).get('m');
        const item = items.find(i => i.id === wanted) || items[0];

        if (items.length > 1) {
          const pick = document.createElement('select');
          pick.id = 'pick';
          for (const i of items) pick.add(new Option(i.title, i.id, false, i === item));
          pick.onchange = () => { location.search = '?m=' + encodeURIComponent(pick.value); };
          document.body.append(pick);
        }

        // SAT's own preload list, with our still in the test pattern's place.
        const preload = (await (await realFetch('preload.json')).json())
          .filter(f => !f.source.includes('/.git'))
          .map(f => item.src && f.destination === '/app/assets/8192.png' ? { ...f, source: item.src } : f);
        // A video item: preload the file into the wasm filesystem and tell the
        // QML (DomeportView.qml) to open it in Domeport's own "Video file" mode.
        const env = { QML2_IMPORT_PATH: '/app/qml' };
        if (item.video) {
          const dest = '/app/media/' + item.video.split('/').pop();
          preload.push({ source: item.video, destination: dest });
          env.PETALS_DOME_VIDEO = dest;
        }
        const preloadUrl = URL.createObjectURL(new Blob([JSON.stringify(preload)], { type: 'application/json' }));

        await qtLoad({
          arguments: ['--ui', '/app/qml/Main.qml', '/app/app.score'],
          qt: {
            preload: [preloadUrl],
            environment: env,
            onLoaded: () => { status.hidden = true; },
            onExit: e => { status.hidden = false; status.textContent = 'Viewer stopped' + (e.text ? ': ' + e.text : ''); },
            entryFunction: window.score_entry,
            containerElements: [screen],
          },
        });
      } catch (e) {
        status.textContent = e.message;
        console.error(e);
      }
    }
    window.addEventListener('load', boot);
  </script>
  <script src="ossia-score.js"></script>
  <script src="qtloader.js"></script>
</body>
</html>
